/* =========================================================
   TRENDZ ARTISTIC TRUST SYSTEM
========================================================= */

.trendz-trust {

    --trust-pink: #ec4899;
    --trust-orange: #fb923c;
    --trust-cyan: #22d3ee;
}


/* =========================================================
   BACKGROUND
========================================================= */

.trust-orb {
    position: absolute;
    width: 25rem;
    height: 25rem;

    border-radius: 999px;

    filter: blur(90px);

    opacity: .45;

    animation:
        trustFloat 12s ease-in-out infinite alternate;
}

.trust-orb-purple {
    left: -12rem;
    top: 35%;

    background:
        rgba(139,92,246,.18);
}

.trust-orb-cyan {
    right: -12rem;
    top: 5%;

    background:
        rgba(34,211,238,.13);

    animation-delay: -4s;
}

.trust-orb-orange {
    left: 42%;
    bottom: -15rem;

    background:
        rgba(251,146,60,.1);

    animation-delay: -7s;
}


@keyframes trustFloat {

    from {
        transform:
            translate3d(0,0,0)
            scale(1);
    }

    to {
        transform:
            translate3d(35px,-25px,0)
            scale(1.12);
    }

}


.trust-grid {

    position: absolute;
    inset: 0;

    opacity: .32;

    background-image:
        radial-gradient(
            #cbd5e1 .7px,
            transparent .7px
        );

    background-size:
        25px 25px;

    mask-image:
        linear-gradient(
            to bottom,
            transparent,
            black 18%,
            black 80%,
            transparent
        );
}


/* =========================================================
   RIBBONS
========================================================= */

.trust-ribbon {

    position: absolute;

    width: 120%;
    height: 100%;

    left: -10%;
    top: 0;

    overflow: visible;
}

.trust-ribbon-main {

    animation:
        trustRibbonMove 18s
        ease-in-out
        infinite alternate;
}

.trust-ribbon-secondary {

    animation:
        trustRibbonReverse 22s
        ease-in-out
        infinite alternate;
}


@keyframes trustRibbonMove {

    from {
        transform:
            translateX(-1%)
            rotate(-.5deg);
    }

    to {
        transform:
            translateX(2%)
            rotate(.7deg);
    }

}


@keyframes trustRibbonReverse {

    from {
        transform:
            translateX(1%)
            rotate(.4deg);
    }

    to {
        transform:
            translateX(-2%)
            rotate(-.5deg);
    }

}


/* =========================================================
   FLOATING DOTS
========================================================= */

.trust-dot {

    position: absolute;

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            var(--trust-purple),
            var(--trust-pink)
        );

    box-shadow:
        0 0 20px rgba(236,72,153,.4);

    animation:
        trustDotFloat
        5s
        ease-in-out
        infinite;
}

.trust-dot-1 {
    top: 22%;
    left: 19%;
}

.trust-dot-2 {
    top: 42%;
    right: 21%;

    background:
        linear-gradient(

    animation-delay: -1.5s;
}

.trust-dot-3 {
    bottom: 24%;
    left: 34%;

    animation-delay: -3s;
}

.trust-dot-4 {
    bottom: 18%;
    right: 34%;

    background:
        var(--trust-cyan);

    animation-delay: -4s;
}


@keyframes trustDotFloat {

    0%,
    100% {
        transform:
            translate3d(0,0,0)
            scale(1);
    }

    50% {
        transform:
            translate3d(0,-14px,0)
            scale(1.5);
    }

}

========================================================= */

.trust-header {

/* =========================================================

========================================================= */

.trust-edge {

.trust-marquee {

    display: flex;

.trust-group {
