

<!-- =========================================================
     GSAP
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>


<script>

document.addEventListener(
    'DOMContentLoaded',
    function () {

        /* =====================================================
           LUCIDE
        ====================================================== */

        if (window.lucide) {
            lucide.createIcons();
        }


        /* =====================================================
           MOTION SETTINGS
        ====================================================== */

        const reduceMotion =
            window.matchMedia(
                '(prefers-reduced-motion: reduce)'
            ).matches;


        /* =====================================================
           GSAP REVEALS
        ====================================================== */

        const revealElements =
            document.querySelectorAll(
                '.tz-client-reveal'
            );


        if (
            !reduceMotion &&
            window.gsap &&
            window.ScrollTrigger
        ) {

            gsap.registerPlugin(
                ScrollTrigger
            );


            revealElements.forEach(
                function (element) {

                    gsap.fromTo(
                        element,
                        {
                            opacity: 0,
                            y: 32
                        },
                        {
                            opacity: 1,
                            y: 0,

                            duration: .8,

                            ease:
                                'power3.out',

                            scrollTrigger: {

                                trigger:
                                    element,

                                start:
                                    'top 88%',

                                once:
                                    true

                            }
                        }
                    );

                }
            );


            /* ---------------------------------------------
               Stagger client cards
            --------------------------------------------- */

            const clientCards =
                document.querySelectorAll(
                    '.tz-client-card'
                );


            clientCards.forEach(
                function (card, index) {

                    gsap.fromTo(
                        card,
                        {
                            opacity: 0,
                            y: 30
                        },
                        {
                            opacity: 1,
                            y: 0,

                            duration: .7,

                            delay:
                                (index % 3) * .08,

                            ease:
                                'power3.out',

                            scrollTrigger: {

                                trigger:
                                    card,

                                start:
                                    'top 91%',

                                once:
                                    true

                            }
                        }
                    );

                }
            );

        } else {

            revealElements.forEach(
                function (element) {

                    element.classList.add(
                        'is-visible'
                    );

                }
            );

        }


        /* =====================================================
           NETWORK NODE MICRO-MOTION
        ====================================================== */

        if (
            !reduceMotion &&
            window.gsap
        ) {

            gsap.to(
                '.tz-network-node',
                {
                    y: -5,

                    duration: 2.6,

                    ease:
                        'sine.inOut',

                    stagger: {
                        each: .25,
                        repeat: -1,
                        yoyo: true
                    }
                }
            );

        }


        /* =====================================================
           LOGO HOVER — DESKTOP
        ====================================================== */

        const finePointer =
            window.matchMedia(
                '(hover: hover) and (pointer: fine)'
            ).matches;


        if (
            finePointer &&
            !reduceMotion
        ) {

            document
                .querySelectorAll(
                    '.tz-client-card'
                )
                .forEach(
                    function (card) {

                        card.addEventListener(
                            'mousemove',
                            function (event) {

                                const rect =
                                    card.getBoundingClientRect();

                                const x =
                                    (
                                        event.clientX -
                                        rect.left
                                    ) /
                                    rect.width -
                                    .5;

                                const y =
                                    (
                                        event.clientY -
                                        rect.top
                                    ) /
                                    rect.height -
                                    .5;

                                card.style.transform =
                                    `
                                    translateY(-8px)
                                    perspective(900px)
                                    rotateX(${y * -2}deg)
                                    rotateY(${x * 2}deg)
                                    `;

                            }
                        );


                        card.addEventListener(
                            'mouseleave',
                            function () {

                                card.style.transform =
                                    '';

                            }
                        );

                    }
                );

        }

    }
);

</script>
