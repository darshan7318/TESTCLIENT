/* =========================================================
   TRENDZ EVENTZ — CONTACT EXPERIENCE
   ========================================================= */

:root {
    --tz-violet: #5b21b6;
    --tz-violet-dark: #3b0764;
    --tz-violet-deep: #24113f;
    --tz-purple-soft: #f4efff;
    --tz-ink: #171321;
    --tz-muted: #6f6878;
    --tz-line: rgba(91, 33, 182, 0.12);
}

/* ---------- Base ---------- */

.tz-contact {
    position: relative;
    overflow: hidden;
    background:
        linear-gradient(
            180deg,
            #faf8ff 0%,
            #ffffff 28%,
            #ffffff 100%
        );
    color: var(--tz-ink);
}

.tz-contact *,
.tz-contact *::before,
.tz-contact *::after {
    box-sizing: border-box;
}

/* ---------- Ambient System ---------- */

.tz-contact-ambient {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
}

.tz-contact-grid {
    position: absolute;
    inset: 0;
    opacity: .38;
    background-image:
        radial-gradient(
            circle at 1px 1px,
            rgba(91, 33, 182, .12) 1px,
            transparent 1.2px
        );
    background-size: 28px 28px;
    mask-image: linear-gradient(
        to bottom,
        black 0%,
        rgba(0,0,0,.7) 30%,
        transparent 85%
    );
}

.tz-contact-orb {
    position: absolute;
    border-radius: 999px;
    filter: blur(1px);
    opacity: .65;
    animation: tzFloat 12s ease-in-out infinite;
}

.tz-contact-orb.one {
    width: 420px;
    height: 420px;
    top: -180px;
    right: -120px;
    background:
        radial-gradient(
            circle,
            rgba(167, 139, 250, .35) 0%,
            rgba(196, 181, 253, .12) 45%,
            transparent 72%
        );
}

.tz-contact-orb.two {
    width: 360px;
    height: 360px;
    top: 600px;
    left: -190px;
    background:
        radial-gradient(
            circle,
            rgba(129, 140, 248, .18) 0%,
            rgba(236, 72, 153, .08) 50%,
            transparent 72%
        );
    animation-delay: -4s;
}

.tz-contact-orb.three {
    width: 300px;
    height: 300px;
    bottom: 400px;
    right: -160px;
    background:
        radial-gradient(
            circle,
            rgba(244, 114, 182, .13) 0%,
            rgba(196, 181, 253, .08) 50%,
            transparent 72%
        );
    animation-delay: -7s;
}

@keyframes tzFloat {
    0%,
    100% {
        transform: translate3d(0, 0, 0) scale(1);
    }

    50% {
        transform: translate3d(0, -22px, 0) scale(1.03);
    }
}

/* ---------- Hero ---------- */

.tz-contact-hero {
    position: relative;
    min-height: 520px;
    display: flex;
    align-items: center;
    padding: 76px 0 92px;
    overflow: hidden;

}

.tz-contact-hero .tz-contact-breadcrumb a:hover {

}

.tz-contact-hero .tz-contact-breadcrumb span {

}

.tz-contact-hero .tz-contact-breadcrumb .current {

.tz-contact-hero .tz-contact-eyebrow-dot {

.tz-contact-hero .tz-contact-title {

.tz-contact-hero-grid {

.tz-contact-title {

.tz-contact-hero-copy strong {

/* ---------- Hero Visual ---------- */

.tz-contact-orbit {

.tz-contact-orbit::before,

.tz-contact-orbit::before {

        linear-gradient(
            135deg,
            #5b21b6,

.tz-contact-orbit-label {

.tz-contact-orbit-label.three {

}

.tz-contact-orbit-label span {

@keyframes tzOrbit {

        transform: rotate(0deg);

    to {
        transform: rotate(360deg);
    }
}

/* ---------- Main Contact ---------- */

.tz-contact-main {
    position: relative;
    z-index: 3;

}

.tz-contact-container {
    max-width: 1280px;
    margin: 0 auto;

.tz-contact-layout {

}

.tz-info-panel::before {

            rgba(139,92,246,.15),

.tz-info-kicker {

    padding-top: 28px;

}

.tz-info-item {

    grid-template-columns: 46px minmax(0,1fr);

.tz-info-icon {

.tz-info-label {

.tz-info-value a {

.tz-map {

.tz-trust-item {

.tz-rfp-panel {

.tz-rfp-panel::before {

    position: absolute;
    top: 0;
    right: 0;
    width: 330px;
    height: 220px;

.tz-rfp-description {

    font-size: 13px;
    line-height: 1.75;
}

.tz-error {

    gap: 12px;
    margin-bottom: 25px;
    padding: 15px 17px;
    border: 1px solid #fecdd3;
    border-radius: 17px;
    background: #fff1f2;
    color: #9f1239;
    font-size: 11px;
    font-weight: 700;

/* ---------- Form ---------- */

.tz-form {
    position: relative;
}

.tz-form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0,1fr));
    gap: 20px;
}

.tz-field {
    margin-bottom: 21px;
}

.tz-field.full {
    grid-column: 1 / -1;
}

.tz-label {
    display: block;
    margin-bottom: 8px;
    color: #4c4551;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: .1em;
    text-transform: uppercase;
}

.tz-required {
    color: #e11d48;
}

.tz-input,
.tz-select,
.tz-textarea {
    display: block;
    width: 100%;
    border: 1px solid #e5e0e8;
    border-radius: 15px;
    background: #faf9fb;
    color: #211b25;
    font-family: inherit;
    font-size: 13px;
    outline: none;
    transition:
        border-color .25s ease,
        background .25s ease,
        box-shadow .25s ease,
        transform .25s ease;
}

.tz-input,
.tz-select {
    height: 52px;
    padding: 0 15px;
}

.tz-textarea {
    min-height: 145px;
    padding: 15px;
    resize: vertical;
    line-height: 1.65;
}

.tz-input::placeholder,
.tz-textarea::placeholder {
    color: #aaa3ad;
}

.tz-input:hover,
.tz-select:hover,
.tz-textarea:hover {
    border-color: #d5cce0;
}

.tz-input:focus,
.tz-select:focus,
.tz-textarea:focus {
